name: journaltwolife
description: "journal2life - Diario emocional con IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # Reconocimiento de voz
  speech_to_text: ^7.3.0

  # Utilidades
  url_launcher: ^6.1.14
  http: ^1.1.0
  crypto: ^3.0.3
  dart_jsonwebtoken: ^2.4.1
  permission_handler: ^11.3.0
  share_plus: ^12.0.0
  path_provider: ^2.0.15
  csv: ^6.0.0

  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase (alineado con Four)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_remote_config: ^6.0.2
  google_sign_in: ^6.1.4

  # State management
  provider: ^6.1.2

  # Date and time formatting
  intl: ^0.20.2

  # Localización (12 idiomas)
  easy_localization: ^3.0.5
  shared_preferences: ^2.0.18
  flutter_localizations:
    sdk: flutter

  # Gráficas para estadísticas
  fl_chart: ^0.70.0
  syncfusion_flutter_charts: ^31.1.22

  collection: any

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/langs/
    - assets/journal2life_logo.png
    - assets/google_logo.png

flutter_launcher_icons:
  image_path: "assets/journal2life_icon.png"
  android: true
  ios: true
